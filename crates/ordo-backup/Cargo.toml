[package]
name = "ordo-backup"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
anyhow = "1.0.86"
thiserror = "1.0.63"
rusqlite = { version = "0.31.0", features = ["bundled", "backup"] }
zip = "2.1.3"
chrono = "0.4.38"
clap = { version = "4.5.4", features = ["derive"] }
uuid = { version = "1.8.0", features = ["v4"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.8"
walkdir = "2.5.0"

[dev-dependencies]
tempfile = "3.10.1"
