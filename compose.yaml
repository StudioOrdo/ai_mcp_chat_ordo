services:
  app:
    image: kaw393939/studioordo:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_VERSION: ${ORDO_NODE_VERSION:-22.22.2}
    container_name: studioordo
    restart: unless-stopped
    stop_grace_period: 15s
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: ${ORDO_PIDS_LIMIT:-256}
    mem_reservation: ${ORDO_MEMORY_RESERVATION:-512m}
    mem_limit: ${ORDO_MEMORY_LIMIT:-2g}
    cpus: ${ORDO_CPUS:-2.0}
    logging:
      driver: json-file
      options:
        max-size: ${ORDO_LOG_MAX_SIZE:-10m}
        max-file: ${ORDO_LOG_MAX_FILE:-5}
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=${ORDO_TMP_SIZE:-512m}
      - /app/.runtime-logs:rw,noexec,nosuid,nodev,size=${ORDO_RUNTIME_LOG_TMPFS_SIZE:-64m}
      - /app/.next/cache:rw,noexec,nosuid,nodev,size=${ORDO_NEXT_CACHE_TMPFS_SIZE:-256m}
    volumes:
      - ./.data:/app/.data
      - ./config:/app/config:ro
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: "0.0.0.0"
      AI_PROVIDER: ${AI_PROVIDER:-anthropic}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_API_KEY_FILE: ${ANTHROPIC_API_KEY_FILE:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
      ANTHROPIC_REQUEST_TIMEOUT_MS: ${ANTHROPIC_REQUEST_TIMEOUT_MS:-10000}
      ANTHROPIC_RETRY_ATTEMPTS: ${ANTHROPIC_RETRY_ATTEMPTS:-2}
      ANTHROPIC_RETRY_DELAY_MS: ${ANTHROPIC_RETRY_DELAY_MS:-150}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_API_KEY_FILE: ${DEEPSEEK_API_KEY_FILE:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-}
      DEEPSEEK_REQUEST_TIMEOUT_MS: ${DEEPSEEK_REQUEST_TIMEOUT_MS:-10000}
      DEEPSEEK_RETRY_ATTEMPTS: ${DEEPSEEK_RETRY_ATTEMPTS:-2}
      DEEPSEEK_RETRY_DELAY_MS: ${DEEPSEEK_RETRY_DELAY_MS:-150}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_API_KEY_FILE: ${OPENAI_API_KEY_FILE:-}
      IMAGE_PROVIDER: ${IMAGE_PROVIDER:-disabled}
      IMAGE_MODEL: ${IMAGE_MODEL:-}
      TTS_PROVIDER: ${TTS_PROVIDER:-disabled}
      TTS_MODEL: ${TTS_MODEL:-}
      STT_PROVIDER: ${STT_PROVIDER:-disabled}
      STT_MODEL: ${STT_MODEL:-}
      WEB_SEARCH_PROVIDER: ${WEB_SEARCH_PROVIDER:-disabled}
      WEB_SEARCH_MODEL: ${WEB_SEARCH_MODEL:-}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      ELEVENLABS_API_KEY_FILE: ${ELEVENLABS_API_KEY_FILE:-}
      ELEVENLABS_VOICE_ID: ${ELEVENLABS_VOICE_ID:-}
      MEDIA_WORKER_SHARED_SECRET: ${MEDIA_WORKER_SHARED_SECRET:-}
      MEDIA_WORKER_SHARED_SECRET_FILE: ${MEDIA_WORKER_SHARED_SECRET_FILE:-}
      ORDO_INSTALL_TOKEN: ${ORDO_INSTALL_TOKEN:-}
      ORDO_INSTALL_TOKEN_FILE: ${ORDO_INSTALL_TOKEN_FILE:-}
      ORDO_INTERNAL_RUNTIME_SERVICE_TOKEN: ${ORDO_INTERNAL_RUNTIME_SERVICE_TOKEN:-}
      ORDO_INTERNAL_RUNTIME_SERVICE_TOKEN_FILE: ${ORDO_INTERNAL_RUNTIME_SERVICE_TOKEN_FILE:-}
      SHUTDOWN_TIMEOUT_MS: ${SHUTDOWN_TIMEOUT_MS:-10000}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health/live >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
