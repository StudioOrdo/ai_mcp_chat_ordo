name: Bug Report
description: Report a product, install, command, workflow, or UI failure with reproducible evidence.
title: "[bug]: "
labels:
  - bug
body:
  - type: input
    id: surface
    attributes:
      label: Surface Or Command
      description: Which page, API route, command, install path, or workflow failed?
      placeholder: /chat, npm run dev, Docker quick start, media worker
    validations:
      required: true

  - type: dropdown
    id: runtime_context
    attributes:
      label: Runtime Context
      description: Where did this happen?
      options:
        - local-dev
        - docker
        - hosted-reverse-proxy
        - browser
        - docs-only
        - unknown
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps To Reproduce
      description: List the smallest set of steps that triggers the failure.
      placeholder: |
        1. Run ...
        2. Open ...
        3. Click ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should have happened?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What happened instead? Include exact errors when possible.
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Paste logs, screenshots, terminal output, browser console output, or failing tests.

  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmation
      options:
        - label: I included enough detail for someone else to try reproducing the bug.
          required: true
